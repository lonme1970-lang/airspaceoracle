    <style>
        :root { --primary: #4CAF50; --error: #f44336; --bg: #121212; --panel: #1e1e1e; --text: #e0e0e0; --border: #333; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; background-color: var(--bg); color: var(--text); }
        
        #sidebar { width: 400px; background-color: var(--panel); display: flex; flex-direction: column; border-right: 1px solid var(--border); box-shadow: 2px 0 10px rgba(0,0,0,0.8); z-index: 1000; }
        .header { padding: 20px; border-bottom: 1px solid var(--border); }
        h2 { font-size: 1.2rem; margin: 0 0 10px 0; color: #fff; text-transform: uppercase; letter-spacing: 1px;}
        
        input[type="text"] { width: 100%; padding: 12px; background-color: #2d2d2d; border: 1px solid #555; color: #fff; box-sizing: border-box; border-radius: 4px; font-family: monospace; font-size: 14px; }
        input[type="text"]:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 5px rgba(76, 175, 80, 0.5); }
        
        #tools-panel { padding: 10px 20px; font-size: 0.85rem; color: #aaa; background: #1a1a1a; border-bottom: 1px solid var(--border); }
        
        #resultsList { flex-grow: 1; overflow-y: auto; padding: 15px; }
        
        .lz-card { background-color: #2a2a2a; padding: 15px; margin-bottom: 12px; border-radius: 4px; cursor: pointer; border-left: 4px solid #555; transition: all 0.2s ease; }
        .lz-card:hover { border-left-color: var(--primary); background-color: #333; }
        .lz-title { font-weight: bold; font-size: 1.1rem; color: var(--primary); margin-bottom: 5px; }
        .lz-aliases { font-size: 0.8rem; color: #888; font-style: italic; margin-bottom: 8px; }
        .lz-detail { font-size: 0.85rem; color: #ccc; margin-bottom: 3px; font-family: monospace; }
        
        #map { flex-grow: 1; height: 100vh; z-index: 1; }
        
        .tactical-marker { background-color: var(--primary); border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 10px #000; }
        .target-marker { background-color: var(--error); border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 15px var(--error); animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(244, 67, 54, 0); } 100% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0); } }
    #footer { 
            padding: 15px; 
            font-size: 0.75rem; 
            color: #777; 
            text-align: center; 
            border-top: 1px solid var(--border); 
            background-color: #1a1a1a; 
            line-height: 1.4;
        }
        #footer a { 
            color: var(--primary); 
            text-decoration: none; 
        }
        #footer a:hover { 
            text-decoration: underline; 
        }
        /* Tactical Popup Expansion */
        .tactical-popup .leaflet-popup-content {
            white-space: nowrap !important;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>

// --- AUTO-MGRS PATCH (Self-Healing Protocol) ---
// This sweeps the array and automatically calculates missing MGRS coordinates from Lat/Long
inventory.forEach(site => {
    // Detect missing, generic, or incomplete MGRS strings
    if (site.mgrs === "52S *" || site.mgrs === "N/A" || !site.mgrs || site.mgrs.trim() === "") {
        try {
            // mgrs.forward converts [longitude, latitude] into an MGRS string. 
            // The '5' requests 1-meter precision (10-digit grid).
            const rawMgrs = mgrs.forward([site.lng, site.lat], 5);
            
            // Format it to Eighth Army standard spacing: "52S CG 12345 67890"
            site.mgrs = rawMgrs.replace(/^(\d{1,2}[A-Z])([A-Z]{2})(\d{5})(\d{5})$/, "$1 $2 $3 $4");
            
        } catch(e) {
            console.warn(`[SYSTEM ALARM] MGRS conversion failed for ${site.primaryName}`);
        }
    }
});

        const darkTactical = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 18, attribution: '&copy; CARTO' });
        const satelliteView = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, attribution: 'Tiles &copy; Esri' });

        const map = L.map('map', { center: [37.5, 127.0], zoom: 8, layers: [satelliteView] });
        L.control.layers({ "Satellite Optics": satelliteView,"Dark Tactical": darkTactical }).addTo(map);

        let markers = [];
        let targetMarker = null; 

function renderData(data) {
    const list = document.getElementById('resultsList');
    if (!list) return; // Defensive check
    
    list.innerHTML = ''; // Clear the panel
    
    // Remove old tactical markers from map
    markers.forEach(m => map.removeLayer(m));
    markers = [];

    data.forEach(site => {
        // Step 1: Process the array safely. If empty, output 'None'
        const aliasDisplay = (site.aliases && site.aliases.length > 0) ? site.aliases.join(', ') : 'None';
        // Checks if ICAO exists and has data. If yes, joins them. If no, displays 'None'.
        const icaoDisplay = (site.ICAO && site.ICAO.length > 0) ? site.ICAO.join(', ') : 'None';
        // Step 2: Build the Sidebar Card
        const card = document.createElement('div');
        card.className = 'lz-card';
        card.innerHTML = `
                <div class="lz-title">${site.primaryName}</div>
                <div class="lz-detail" style="color: #aaa; font-style: italic;">Aliases: ${aliasDisplay}</div>
                <div class="lz-detail" style="color: #4CAF50; font-weight: bold;">ICAO: ${icaoDisplay}</div>
                <div class="lz-detail">MGRS: ${site.mgrs}</div>
                <div class="lz-detail">L/L: ${site.lat.toFixed(4)}, ${site.lng.toFixed(4)}</div>
        `;
        
        // Step 3: Deploy Marker & Bind Popup IMMEDIATELY
        const icon = L.divIcon({ html: '<div class="tactical-marker" style="width:12px; height:12px;"></div>', className: '' });
        const marker = L.marker([site.lat, site.lng], {icon: icon}).addTo(map);
        // 2. Attach the Expanded Popup
        marker.bindPopup(
            `<b>${site.primaryName}</b><br>
            <span style="color: #aaa; font-style: italic;">Aliases: ${aliasDisplay}</span><br>
            <span style="color: #4CAF50; font-weight: bold;">ICAO: ${icaoDisplay}</span><br>
            <span style="color: #4CAF50;">Grid: ${site.mgrs}</span>`, 
            { 
                maxWidth: 600,     // Allows the popup to stretch for long names
                minWidth: 200,     // Prevents it from being too narrow
                className: 'tactical-popup' // Links to the CSS rule below
            }
        );
        markers.push(marker);

        // Sidebar click interaction
        card.onclick = () => {
            map.flyTo([site.lat, site.lng], 15);
            marker.bindPopup(`<b>${site.primaryName}</b><br>${site.mgrs}`).openPopup();
        };
        
        // CRITICAL: Push the card into the sidebar
        list.appendChild(card);
    });
}

function processInput() {
            const rawInput = document.getElementById('searchInput').value.trim();
            const statusBox = document.getElementById('conversionStatus');
            
            if(targetMarker) { map.removeLayer(targetMarker); targetMarker = null; }

            if (rawInput === '') {
                statusBox.innerHTML = `System Ready. Monitoring Frequencies.`;
                renderData(inventory);
                return; 
            }

            const llMatch = rawInput.match(/^(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)$/);
            if(llMatch) {
                const lat = parseFloat(llMatch[1]);
                const lng = parseFloat(llMatch[2]);
                statusBox.innerHTML = `Coordinate Pair Identified: ${lat}, ${lng}`;
                dropTargetMarker(lat, lng, `Manual Entry`);
                return;
            }

            // --- MULTI-TARGET ARRAY ---
            const searchTerms = rawInput.split(',')
                .map(term => term.replace(/[^A-Z0-9]/gi, '').toUpperCase())
                .filter(term => term !== '');

            // --- EXACT MGRS CHECK ---
            if (searchTerms.length === 1) {
                const singleTerm = searchTerms[0];
                const mgrsPattern = /^[0-9]{1,2}[A-Z]{3}[0-9]{2,10}$/;
                if(mgrsPattern.test(singleTerm)) {
                    try {
                        const coords = mgrs.toPoint(singleTerm);
                        statusBox.innerHTML = `MGRS Grid Locked: ${singleTerm}`;
                        dropTargetMarker(coords[1], coords[0], `Grid: ${singleTerm}`);
                        return;
                    } catch(e) {}
                }
            }

            // --- BULLETPROOF FILTER ENGINE ---
            const filtered = inventory.filter(site => {
                const searchableData = (
                    (site.primaryName || "") + 
                    (site.aliases ? site.aliases.join('') : "") + 
                    (site.ICAO ? site.ICAO.join('') : "") + 
                    (site.mgrs || "") + 
                    (site.type || "")
                ).replace(/[^A-Z0-9]/gi, '').toUpperCase();
                
                return searchTerms.some(term => searchableData.includes(term));
            });

            if (filtered.length > 0) {
                statusBox.innerHTML = `Multi-Target Match: ${filtered.length} Identifiers Acquired.`;
                renderData(filtered);
            } else {
                statusBox.innerHTML = `<span style="color:var(--error);">No Data Found for "${rawInput}"</span>`;
                renderData(inventory); 
            }
        }
        function dropTargetMarker(lat, lng, label) {
            const icon = L.divIcon({ html: '<div class="target-marker" style="width:16px; height:16px;"></div>', className: '' });
            targetMarker = L.marker([lat, lng], {icon: icon}).addTo(map)
                .bindPopup(`<b>Tactical Target</b><br>${label}<br>${lat.toFixed(5)}, ${lng.toFixed(5)}`)
                .openPopup();
            map.flyTo([lat, lng], 15);
        }

        // --- DATA INTEGRITY: AUTO-SORTER PATCH ---
        inventory.forEach(site => {
            if (!site.ICAO) site.ICAO = []; 
            if (site.aliases && site.aliases.length > 0) {
                const icaoCodes = site.aliases.filter(alias => alias.startsWith("RK"));
                const normalAliases = site.aliases.filter(alias => !alias.startsWith("RK"));
                site.ICAO = site.ICAO.concat(icaoCodes);
                site.aliases = normalAliases;
            }
        });
        // -----------------------------------------

        // --- MASTER BOOT SEQUENCE ---
        renderData(inventory);
    </script>
